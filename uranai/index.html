<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>サッカーポジション診断</title>
<style>
:root {
  --green: #06C755;
  --green-dark: #05A847;
  --green-light: #E8F9F0;
  --bg: #EDEDED;
  --header-bg: #06C755;
  --white: #FFFFFF;
  --text: #1A1A1A;
  --text-sub: #888;
  --shadow: 0 1px 2px rgba(0,0,0,0.15);
  --radius-bubble: 18px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: -apple-system, 'Hiragino Sans', 'Meiryo', 'Yu Gothic', sans-serif;
  background: var(--bg);
  display: flex; flex-direction: column; height: 100%;
  font-size: 15px;
}

/* ── ヘッダー ── */
.header {
  background: var(--header-bg);
  color: #fff;
  padding: 12px 16px;
  text-align: center;
  font-size: 15px;
  font-weight: bold;
  letter-spacing: .5px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  flex-shrink: 0;
}
.header small { font-size: 11px; font-weight: normal; opacity: .85; display: block; }

/* ── チャットエリア ── */
#chat {
  flex: 1;
  overflow-y: auto;
  padding: 16px 12px 8px;
  display: flex; flex-direction: column; gap: 10px;
  -webkit-overflow-scrolling: touch;
}

/* ── バブル ── */
.row { display: flex; align-items: flex-end; gap: 7px; animation: fadeUp .25s ease; }
.row.bot { justify-content: flex-start; }
.row.user { justify-content: flex-end; }

.avatar {
  width: 34px; height: 34px; border-radius: 50%;
  background: var(--green); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; box-shadow: var(--shadow);
}

.bubble {
  max-width: 72%; padding: 10px 14px;
  font-size: 14px; line-height: 1.65;
  box-shadow: var(--shadow); word-break: break-word;
}
.bot .bubble {
  background: var(--white); color: var(--text);
  border-radius: var(--radius-bubble) var(--radius-bubble) var(--radius-bubble) 4px;
}
.user .bubble {
  background: var(--green); color: #fff;
  border-radius: var(--radius-bubble) var(--radius-bubble) 4px var(--radius-bubble);
}

/* タイピング */
.typing { display: flex; gap: 5px; padding: 12px 16px; align-items: center; }
.typing span {
  width: 8px; height: 8px; background: #bbb; border-radius: 50%;
  animation: bounce .9s infinite;
}
.typing span:nth-child(2) { animation-delay: .2s; }
.typing span:nth-child(3) { animation-delay: .4s; }
@keyframes bounce { 0%,100%{transform:translateY(0);opacity:.4} 50%{transform:translateY(-5px);opacity:1} }
@keyframes fadeUp { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }

/* ── 入力エリア ── */
#input-area {
  background: #f7f7f7;
  border-top: 1px solid #ddd;
  padding: 10px 12px;
  flex-shrink: 0;
}

/* ボタン */
.btn {
  background: var(--green); color: #fff;
  border: none; border-radius: 24px;
  padding: 11px 22px; font-size: 14px; font-weight: bold;
  cursor: pointer; font-family: inherit;
  transition: background .15s, transform .1s;
  width: 100%;
}
.btn:active { background: var(--green-dark); transform: scale(.97); }

.btn-outline {
  background: #fff; color: var(--green);
  border: 2px solid var(--green);
}
.btn-outline:active { background: var(--green-light); }

/* 日付入力 */
.date-row { display: flex; gap: 8px; align-items: center; }
.date-row input[type=date] {
  flex: 1; padding: 10px 12px;
  border: 2px solid #ddd; border-radius: 24px;
  font-size: 14px; font-family: inherit; outline: none;
  transition: border-color .2s;
}
.date-row input[type=date]:focus { border-color: var(--green); }
.date-row .btn { width: auto; padding: 10px 20px; }

/* 選択肢 */
.choices { display: flex; flex-direction: column; gap: 7px; }
.choice {
  background: #fff; border: 2px solid #ddd;
  border-radius: 12px; padding: 11px 14px;
  font-size: 13px; line-height: 1.55; text-align: left;
  cursor: pointer; font-family: inherit; color: var(--text);
  transition: all .15s;
}
.choice:active { background: var(--green-light); border-color: var(--green); }
.choice.picked { background: var(--green); color: #fff; border-color: var(--green); }

/* プログレス */
.progress-header {
  display: flex; justify-content: space-between;
  font-size: 11px; color: var(--text-sub); margin-bottom: 5px;
}
.progress-bar { height: 6px; background: #ddd; border-radius: 3px; margin-bottom: 9px; }
.progress-fill { height: 100%; background: var(--green); border-radius: 2px; transition: width .3s; }
.q-label {
  font-size: 13px; font-weight: bold; color: var(--text);
  margin-bottom: 8px; line-height: 1.6;
}

/* ── 結果カード ── */
.result-card {
  background: #fff; border-radius: 16px;
  padding: 20px 16px; text-align: center;
  box-shadow: 0 3px 12px rgba(0,0,0,0.1);
  max-width: 100%;
}
.result-card .big-emoji { font-size: 64px; margin-bottom: 4px; }
.result-card .animal-name { font-size: 22px; font-weight: bold; color: var(--green); }
.result-card .sub { font-size: 12px; color: var(--text-sub); margin: 2px 0 10px; }
.mbti-badge {
  display: inline-block; background: var(--green); color: #fff;
  border-radius: 8px; padding: 5px 18px;
  font-size: 22px; font-weight: bold; letter-spacing: 3px;
}
.phrase-box {
  background: var(--green-light); border-left: 4px solid var(--green);
  border-radius: 8px; padding: 12px 14px;
  font-size: 15px; font-weight: bold; color: #047A3B;
  text-align: left; margin: 14px 0 10px;
  line-height: 1.6;
}
.section { text-align: left; margin-top: 14px; }
.section h3 {
  font-size: 12px; color: var(--text-sub);
  border-bottom: 1px solid #eee; padding-bottom: 4px; margin-bottom: 7px;
}
.section p { font-size: 13px; color: var(--text); line-height: 1.7; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.tag {
  background: var(--green-light); color: #047A3B;
  border-radius: 20px; padding: 3px 10px; font-size: 11px; font-weight: bold;
}
.divider { border: none; border-top: 1px solid #eee; margin: 12px 0; }

/* スタンプ */
.sticker-wrap {
  position: relative; width: 160px; height: 160px;
  margin: 0 auto 14px; flex-shrink: 0;
}
.sticker-bg {
  width: 160px; height: 160px; border-radius: 32px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 6px 20px rgba(0,0,0,0.18);
  position: relative; overflow: hidden;
}
.sticker-bg::before {
  content: ''; position: absolute; inset: 0;
  background: rgba(255,255,255,0.12); border-radius: 32px;
}
/* 画像スタンプ（ヨッシースタイル） */
.sticker-img {
  width: 140px; height: 140px; object-fit: contain;
  position: relative; z-index: 1;
  filter:
    drop-shadow(0 0 3px #fff)
    drop-shadow(0 0 6px #fff)
    drop-shadow(0 4px 8px rgba(0,0,0,0.25));
  animation: stampPop .4s cubic-bezier(.17,.67,.35,1.3) both;
}
@keyframes stampPop {
  0%   { transform: scale(0.5) rotate(-8deg); opacity: 0; }
  70%  { transform: scale(1.12) rotate(2deg); opacity: 1; }
  100% { transform: scale(1) rotate(0deg); }
}
/* 絵文字フォールバック */
.sticker-animal { font-size: 80px; line-height: 1; position: relative; z-index: 1; }
.sticker-badge {
  position: absolute; bottom: -6px; right: -6px;
  width: 52px; height: 52px; border-radius: 50%;
  background: #fff; display: flex; align-items: center; justify-content: center;
  font-size: 28px; box-shadow: 0 3px 10px rgba(0,0,0,0.2);
  border: 3px solid #fff; z-index: 2;
}
.sticker-deco {
  position: absolute; font-size: 18px; z-index: 0; pointer-events: none;
  animation: twinkle 2s infinite;
}
@keyframes twinkle { 0%,100%{opacity:.4;transform:scale(.8)} 50%{opacity:1;transform:scale(1.1)} }

/* PC対応 */
@media (min-width: 560px) {
  #chat { padding: 20px; max-width: 560px; margin: 0 auto; width: 100%; }
  #input-area { max-width: 560px; margin: 0 auto; width: 100%; }
  .header { font-size: 16px; }
  .bubble { max-width: 65%; }
}
</style>

// MBTIの各軸別のポジション適性スコア
const MBTI_AXIS_POS = {
  E:{ GK:0, DF:0, MF:1, FW:2 },  I:{ GK:2, DF:1, MF:0, FW:0 },
  S:{ GK:1, DF:2, MF:0, FW:0 },  N:{ GK:0, DF:0, MF:2, FW:1 },

  J:{ GK:1, DF:2, MF:0, FW:0 },  P:{ GK:0, DF:0, MF:1, FW:2 },
};

function getPosition(animalKey, mt) {
  const score = { GK:0, DF:0, MF:0, FW:0 };
  const a = ANIMAL_POS[animalKey] || {};
  for (const k in score) score[k] += (a[k] || 0);
  mt.split('').forEach(letter => {
    const axis = MBTI_AXIS_POS[letter];
    if (!axis) return;
    for (const k in score) score[k] += axis[k];
  });
  // 最高得点のポジションを採用（同点はGK→DF→MF→FWの優先順）
  const order = ['GK','DF','MF','FW'];
  let best = order[0];
  order.forEach(k => { if (score[k] > score[best]) best = k; });
  return best;
}

    img.src = akey+'_'+mt+'.svg';
  } else if (src.endsWith(akey+'_'+mt+'.svg')) {
    img.src = akey+'.png';
  } else {
    img.style.display = 'none';
    img.nextElementSibling.style.display = 'block';
  }
};

function makeSticker(animal, mt) {
  const meta = MBTI_META[mt];
  const [c1, c2] = meta.color;
  const decos = [
    {top:'-10px',left:'10px',delay:'0s'},
    {top:'5px',right:'-10px',delay:'.6s'},
    {bottom:'10px',left:'-8px',delay:'1.1s'},
  ];
  const decoHtml = decos.map(p => {
    const style = Object.entries(p).filter(([k])=>k!=='delay')
      .map(([k,v])=>`${k}:${v}`).join(';');
    return `<div class="sticker-deco" style="${style};animation-delay:${p.delay}">${meta.deco}</div>`;
  }).join('');

  return `
    <div class="sticker-wrap">
      ${decoHtml}
      <div class="sticker-bg" style="background:linear-gradient(145deg,${c1},${c2})">
        <img class="sticker-img"
          src="${animal.key}_${mt}.png"
          onerror="_imgFallback(this,'${animal.key}','${mt}','${animal.emoji}')"
          alt="${animal.name}">
        <div class="sticker-animal" style="display:none">${animal.emoji}</div>
      </div>
      <div class="sticker-badge">${meta.badge}</div>
    </div>`;
}

   c:['スケジュールや行き先を細かく決める','ざっくりした方向性だけ決めて行き当たりばったりを楽しむ']},
  {d:'JP', text:'締め切りに対する自分の姿勢は？',
   c:['余裕をもって前倒しで終わらせる','ギリギリになって集中力を発揮することが多い']},
  {d:'JP', text:'身の回りの整理整頓は？',
   c:['ものの場所が決まっていて整然としている','必要なものがどこにあるか把握していれば問題ない']},
  {d:'JP', text:'新しいことを始めるとき？',
   c:['全体の計画を立ててから着手する','まずやってみてから調整していく']},
  {d:'JP', text:'複数のことが同時に進んでいる状況は？',
   c:['優先順位をつけて順番に片付けたい','並行して進めることで逆に集中できる']},
];

// ══════════════════════════════════════════════
// ロジック
// ══════════════════════════════════════════════

function getAnimal(y, m, d) {
  let n = String(y).split('').reduce((a,b)=>a+parseInt(b),0) + m + d;
  while (n > 60) n = String(n).split('').reduce((a,b)=>a+parseInt(b),0);
  if (n === 0) n = 12;
  return ANIMALS[(n - 1) % 12];
}

function getMBTI(ans) {
  let E=0,I=0,N=0,S=0,T=0,F=0,J=0,P=0;
  QS.forEach((q,i) => {
    const a = ans[i];
    if (q.d==='EI') a===0?E++:I++;
    else if (q.d==='NS') a===0?N++:S++;
    else if (q.d==='TF') a===0?T++:F++;
    else if (q.d==='JP') a===0?J++:P++;
  });
  return `${E>=I?'E':'I'}${N>=S?'N':'S'}${T>=F?'T':'F'}${J>=P?'J':'P'}`;
}

// ══════════════════════════════════════════════
// UI ヘルパー
// ══════════════════════════════════════════════

const chat = document.getElementById('chat');
const inp  = document.getElementById('input-area');

function scroll() { chat.scrollTop = chat.scrollHeight; }

function addRow(html, who) {
  const row = document.createElement('div');
  row.className = `row ${who}`;
  if (who === 'bot') {
    row.innerHTML = `<div class="avatar">🌿</div><div class="bubble bot">${html}</div>`;
  } else {
    row.innerHTML = `<div class="bubble user">${html}</div>`;
  }
  chat.appendChild(row);
  scroll();
}

let typingEl = null;
function showTyping() {
  typingEl = document.createElement('div');
  typingEl.className = 'row bot';
  typingEl.innerHTML = '<div class="avatar">🌿</div><div class="bubble bot"><div class="typing"><span></span><span></span><span></span></div></div>';
  chat.appendChild(typingEl);
  scroll();
}
function hideTyping() { if (typingEl) { typingEl.remove(); typingEl = null; } }

async function botSay(html, ms=700) {
  showTyping();
  await wait(ms);
  hideTyping();
  addRow(html, 'bot');
}

function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

function clearInput() { inp.innerHTML = ''; }

// ══════════════════════════════════════════════
// フェーズ
// ══════════════════════════════════════════════

let state = {};

async function phaseStart() {
  await botSay('こんにちは！⚽<br>あなたに向いてるサッカーポジション診断へようこそ！', 400);
  await botSay('生年月日と20の質問に答えるだけで<br>動物タイプ×性格タイプからGK/DF/MF/FWのどれが向いてるかわかります✨', 900);
  clearInput();
  const btn = document.createElement('button');
  btn.className = 'btn'; btn.textContent = '診断をスタート 🐾';
  btn.onclick = () => { addRow('診断をスタート 🐾','user'); phaseBirth(); };
  inp.appendChild(btn);
}

async function phaseBirth() {
  clearInput();
  await botSay('まず、生年月日を教えてください📅', 500);
  clearInput();
  const row = document.createElement('div');
  row.className = 'date-row';
  const di = document.createElement('input');
  di.type = 'date';
  di.max = new Date().toISOString().slice(0,10);
  di.min = '1900-01-01';
  const btn = document.createElement('button');
  btn.className = 'btn'; btn.textContent = '決定';
  btn.style.width = 'auto';
  btn.onclick = () => {
    if (!di.value) { di.style.borderColor='#f55'; return; }
    const [y,m,d] = di.value.split('-').map(Number);
    state.animal = getAnimal(y,m,d);
    addRow(`🎂 ${y}年${m}月${d}日生まれ`, 'user');
    phaseQ();
  };
  row.append(di, btn);
  inp.appendChild(row);
}

async function phaseQ() {
  state.answers = [];
  clearInput();
  await botSay('ありがとうございます！<br>続いて20の質問に答えてください🌟', 600);
  await botSay('より自分に近い方を選んでね。<br>直感で選ぶのがおすすめです！', 900);
  showQ(0);
}

async function showQ(idx) {
  clearInput();
  if (idx >= QS.length) { state.mbti = getMBTI(state.answers); phaseResult(); return; }
  const q = QS[idx];
  const total = QS.length;
  const pct = Math.round(idx / total * 100);
  clearInput();

  // Progress
  const pg = document.createElement('div');
  pg.innerHTML = `
    <div class="progress-header"><span>質問 ${idx+1} / ${total}</span><span>${pct}%</span></div>
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="q-label">Q${idx+1}. ${q.text}</div>
  `;

  const cs = document.createElement('div');
  cs.className = 'choices';
  q.c.forEach((txt, ci) => {
    const btn = document.createElement('button');
    btn.className = 'choice'; btn.textContent = txt;
    btn.onclick = async () => {
      if (btn.disabled) return;
      document.querySelectorAll('.choice').forEach(b=>{ b.disabled=true; b.style.cursor='default'; });
      btn.classList.add('picked');
      state.answers[idx] = ci;
      addRow(txt, 'user');
      await wait(300);
      showQ(idx + 1);
    };
    cs.appendChild(btn);
  });

  pg.appendChild(cs);
  inp.appendChild(pg);
  scroll();
}

async function phaseResult() {
  clearInput();
  await botSay('お疲れ様でした！結果を計算中です…🔮', 600);
  await wait(1200);
  await botSay('結果が出ました！🎉', 400);

  const a = state.animal;
  const mt = state.mbti;
  const m = MBTI[mt];
  const posKey = getPosition(a.key, mt);
  const pos = POSITIONS[posKey];
  const phrase = (PHRASES[a.key] && PHRASES[a.key][mt]) || `${a.keyword}な${a.name} × ${m.kw}`;

  // カード
  const row = document.createElement('div');
  row.className = 'row bot';
  const av = document.createElement('div');
  av.className = 'avatar'; av.textContent = '⚽';

  const card = document.createElement('div');
  card.className = 'result-card';
  card.innerHTML = `
    ${makeSticker(a, mt)}
    <div class="big-emoji">${pos.emoji}</div>
    <div class="animal-name">あなたは${pos.name}タイプ！</div>
    <div class="mbti-badge">${posKey}</div>
    <div class="sub" style="margin-top:6px">${a.name}（動物タイプ）× ${mt}（性格タイプ）から診断</div>
    <div class="phrase-box">💬 ${pos.keyword}</div>
    <hr class="divider">
    <div class="section">
      <h3>${pos.emoji} ${pos.name}タイプの特徴</h3>
      <p>${pos.desc}</p>
      <div class="tags">${pos.tags.map(t=>`<span class="tag">#${t}</span>`).join('')}</div>
    </div>
    <hr class="divider">
    <div class="section">
      <h3>🐾 ${a.name}タイプの特徴</h3>
      <p>${a.desc}</p>
      <div class="tags">${a.tags.map(t=>`<span class="tag">#${t}</span>`).join('')}</div>
    </div>
    <div class="section">
      <h3>🧠 ${mt}（${m.name}）の特徴</h3>
      <p>${m.desc}</p>
    </div>
    <div class="section">
      <h3>💬 ひとこと</h3>
      <p>${phrase}</p>
    </div>
  `;

  row.append(av, card);
  chat.appendChild(row);
  scroll();

  await wait(600);
  await botSay(`あなたのポジションは「<b>${pos.emoji} ${pos.name}</b>」です✨<br>（${a.name}×${mt}タイプから診断）<br>どうでしたか？当たってましたか？😊`, 800);

  clearInput();
  const btnWrap = document.createElement('div');
  btnWrap.style.cssText = 'display:flex;flex-direction:column;gap:8px;';

  const btn = document.createElement('button');
  btn.className = 'btn';
  btn.textContent = '🔄 もう一度診断する';
  btn.onclick = () => { chat.innerHTML = ''; state = {}; phaseStart(); };

  const btnMatrix = document.createElement('button');
  btnMatrix.className = 'btn btn-outline';
  btnMatrix.textContent = '📊 動物×性格タイプの一覧を見る';
  btnMatrix.onclick = () => window.open('matrix.html', '_blank');

  btnWrap.append(btn, btnMatrix);
  inp.appendChild(btnWrap);
}

// 起動
phaseStart();
</script>
