<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<title>組み合わせマトリクス｜動物×性格タイプ占い</title>
<style>
:root {
  --green: #D4A01A;
  --green-dark: #A87D14;
  --green-light: #FBF0D9;
  --bg: #EDEDED;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, 'Hiragino Sans', 'Meiryo', 'Yu Gothic', sans-serif;
  background: var(--bg); min-height: 100vh;
}
.header {
  background: var(--green); color: #fff;
  padding: 12px 16px; text-align: center;
  font-size: 15px; font-weight: bold;
  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  position: sticky; top: 0; z-index: 100;
  display: flex; align-items: center; gap: 10px;
}
.header .back {
  background: rgba(255,255,255,0.25); border: none; color: #fff;
  border-radius: 20px; padding: 5px 12px; font-size: 13px;
  cursor: pointer; font-family: inherit; white-space: nowrap;
}
.header .back:hover { background: rgba(255,255,255,0.4); }
.header .title { flex: 1; }
.header small { font-size: 11px; font-weight: normal; opacity: .85; display: block; }

/* フィルター */
.filter-bar {
  background: #fff; padding: 10px 14px;
  display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
  border-bottom: 1px solid #ddd; position: sticky; top: 53px; z-index: 90;
}
.filter-bar label { font-size: 12px; color: #666; font-weight: bold; }
.filter-bar select {
  padding: 5px 10px; border: 2px solid #ddd; border-radius: 20px;
  font-size: 13px; font-family: inherit; outline: none;
  background: #fff; cursor: pointer;
}
.filter-bar select:focus { border-color: var(--green); }
.clear-btn {
  background: #f0f0f0; border: none; border-radius: 20px;
  padding: 5px 12px; font-size: 12px; cursor: pointer; color: #666;
  font-family: inherit;
}
.clear-btn:hover { background: #e0e0e0; }
.count-label { font-size: 12px; color: #888; margin-left: auto; }

/* グリッド */
.grid-wrap { padding: 12px; }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 10px;
}

/* カード */
.card {
  background: #fff; border-radius: 14px;
  padding: 12px 10px 10px;
  text-align: center;
  box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  cursor: default;
  transition: transform .15s, box-shadow .15s;
}
.card:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,0.13); }

.card-sticker {
  position: relative; width: 80px; height: 80px;
  margin: 0 auto 8px;
}
.card-bg {
  width: 80px; height: 80px; border-radius: 18px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 3px 10px rgba(0,0,0,0.18);
  position: relative; overflow: hidden;
}
.card-bg::before {
  content: ''; position: absolute; inset: 0;
  background: rgba(255,255,255,0.1); border-radius: 18px;
}
.card-animal { font-size: 42px; line-height: 1; position: relative; z-index: 1; }
.card-img {
  width: 54px; height: 54px; object-fit: contain;
  position: relative; z-index: 1;
  filter: drop-shadow(0 0 2px #fff) drop-shadow(0 2px 5px rgba(0,0,0,0.2));
}
.card-badge {
  position: absolute; bottom: -4px; right: -4px;
  width: 28px; height: 28px; border-radius: 50%;
  background: #fff; display: flex; align-items: center; justify-content: center;
  font-size: 15px; box-shadow: 0 2px 6px rgba(0,0,0,0.18);
  border: 2px solid #fff;
}
.card-title {
  font-size: 12px; font-weight: bold; color: #222;
  line-height: 1.4; margin-bottom: 2px;
}
.card-mbti {
  display: inline-block; font-size: 10px; font-weight: bold;
  background: var(--green-light); color: var(--green-dark);
  border-radius: 10px; padding: 1px 7px;
}
.card-phrase {
  font-size: 10px; color: #777; margin-top: 5px;
  line-height: 1.4;
  display: -webkit-box; -webkit-line-clamp: 2;
  -webkit-box-orient: vertical; overflow: hidden;
}

.no-result {
  text-align: center; padding: 60px 20px;
  color: #aaa; font-size: 14px; grid-column: 1/-1;
}

/* PC */
@media (min-width: 600px) {
  .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
  .grid-wrap { padding: 16px 20px; max-width: 1200px; margin: 0 auto; }
}
</style>
</head>

  const filterA = selA.value;
  const filterM = selM.value;
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  let count = 0;

  ANIMALS.forEach(a => {
    if (filterA && a.key !== filterA) return;
    MBTI_LIST.forEach(m => {
      if (filterM && m.id !== filterM) return;
      const meta = MBTI_META[m.id];
      const phrase = (PHRASES[a.key] && PHRASES[a.key][m.id]) || '';
      const [c1, c2] = meta.color;

      const card = document.createElement('div');
      card.className = 'card';

      const bg = document.createElement('div');
      bg.className = 'card-bg';
      bg.style.background = `linear-gradient(145deg,${c1},${c2})`;

      const img = document.createElement('img');
      img.className = 'card-img';
      img.alt = a.name;
      img.src = `${a.key}_${m.id}.png`;
      img.onerror = function() {
        const s = this.src;
        if (s.includes(`_${m.id}.png`))      { this.src = `${a.key}_${m.id}.svg`; }
        else if (s.includes(`_${m.id}.svg`)) { this.src = `${a.key}.png`; }
        else { this.style.display='none'; this.nextElementSibling.style.display='block'; }
      };
      const fallback = document.createElement('div');
      fallback.className = 'card-animal';
      fallback.style.display = 'none';
      fallback.textContent = a.emoji;
      bg.append(img, fallback);

      const badge = document.createElement('div');
      badge.className = 'card-badge';
      badge.textContent = meta.badge;

      const sticker = document.createElement('div');
      sticker.className = 'card-sticker';
      sticker.append(bg, badge);

      card.innerHTML = `
        <div class="card-title">${a.name}の${m.name}</div>
        <div class="card-mbti">${m.id}</div>
        <div class="card-phrase">${phrase}</div>
      `;
      card.insertBefore(sticker, card.firstChild);
      grid.appendChild(card);
      count++;
    });
  });

  if (count === 0) {
    const el = document.createElement('div');
    el.className = 'no-result'; el.textContent = '該当する組み合わせがありません';
    grid.appendChild(el);
  }
  document.getElementById('countLabel').textContent = `${count}件表示中`;
}

render();
</script>
</body>
</html>
